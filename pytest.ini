[pytest]
# Suite default = unit test cepat (tanpa model berat). Marker `integration`
# memuat IndoBERT nyata (~500MB, lambat) & sengaja DIKECUALIKAN dari run default
# agar `pytest` tetap < 30 detik dan bisa jalan di lingkungan tanpa model
# (cloud/CI; model di-gitignore). Jalankan E2E secara eksplisit:
#
#     pytest -m integration
#
markers =
    integration: end-to-end memuat best model IndoBERT nyata (lambat; perlu models/best_model/)
addopts = -m "not integration"
